<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matheus C.A — Relatório Meta Ads</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --card: #16161f;
    --border: #1e1e2e;
    --accent: #6c63ff;
    --accent2: #ff6584;
    --green: #43e97b;
    --yellow: #f9ca24;
    --text: #e8e8f0;
    --muted: #6b6b80;
    --radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }

  /* HEADER */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-left { display: flex; align-items: center; gap: 16px; }

  .logo {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Syne', sans-serif;
    font-weight: 800; font-size: 14px; color: #fff;
  }

  .header-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 18px; }
  .header-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .back-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 8px 16px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 13px;
    transition: all .2s;
  }
  .back-btn:hover { color: var(--text); border-color: var(--accent); }

  /* PERIOD SELECTOR */
  .controls {
    padding: 24px 32px 0;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .period-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    transition: all .2s;
  }
  .period-btn:hover { color: var(--text); }
  .period-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .upload-btn {
    background: var(--green);
    border: none;
    color: #0a0a0f;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    font-family: 'DM Sans', sans-serif;
    transition: all .2s;
    margin-left: auto;
  }
  .upload-btn:hover { opacity: .85; }

  #csv-input { display: none; }

  /* STATUS BAR */
  .status-bar {
    margin: 16px 32px 0;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px;
    display: none;
  }
  .status-bar.info { background: rgba(108,99,255,.15); border: 1px solid rgba(108,99,255,.3); color: #a89dff; display: block; }
  .status-bar.success { background: rgba(67,233,123,.1); border: 1px solid rgba(67,233,123,.3); color: var(--green); display: block; }
  .status-bar.error { background: rgba(255,101,132,.1); border: 1px solid rgba(255,101,132,.3); color: var(--accent2); display: block; }

  /* MAIN */
  .main { padding: 24px 32px 48px; }

  /* KPI CARDS */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }

  .kpi-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    position: relative;
    overflow: hidden;
    transition: border-color .2s;
  }
  .kpi-card:hover { border-color: var(--accent); }
  .kpi-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
  }
  .kpi-card.purple::before { background: linear-gradient(90deg, var(--accent), transparent); }
  .kpi-card.pink::before { background: linear-gradient(90deg, var(--accent2), transparent); }
  .kpi-card.green::before { background: linear-gradient(90deg, var(--green), transparent); }
  .kpi-card.yellow::before { background: linear-gradient(90deg, var(--yellow), transparent); }

  .kpi-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 8px; }
  .kpi-value { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800; line-height: 1; }
  .kpi-sub { font-size: 12px; color: var(--muted); margin-top: 6px; }

  /* TABLE */
  .section-title {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 16px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title .badge {
    background: var(--accent);
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 20px;
    font-family: 'DM Sans', sans-serif;
  }

  .table-wrap {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  table { width: 100%; border-collapse: collapse; }
  thead { background: var(--surface); }
  th {
    padding: 12px 16px;
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    font-weight: 500;
  }
  td {
    padding: 14px 16px;
    font-size: 13px;
    border-top: 1px solid var(--border);
  }
  tr:hover td { background: rgba(108,99,255,.04); }

  .camp-name { font-weight: 500; max-width: 280px; }
  .camp-name small { display: block; color: var(--muted); font-size: 11px; font-weight: 400; margin-top: 2px; }

  .badge-status {
    padding: 3px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 500;
  }
  .badge-status.active { background: rgba(67,233,123,.15); color: var(--green); }
  .badge-status.inactive { background: rgba(107,107,128,.1); color: var(--muted); }

  .num { text-align: right; font-family: 'Syne', sans-serif; font-size: 13px; }

  /* EMPTY STATE */
  .empty {
    text-align: center;
    padding: 64px 32px;
    color: var(--muted);
  }
  .empty .icon { font-size: 48px; margin-bottom: 16px; }
  .empty h3 { font-family: 'Syne', sans-serif; font-size: 18px; color: var(--text); margin-bottom: 8px; }
  .empty p { font-size: 14px; line-height: 1.6; max-width: 400px; margin: 0 auto; }

  /* LOADING */
  .loading {
    text-align: center;
    padding: 48px;
    color: var(--muted);
    font-size: 14px;
  }
  .spinner {
    width: 32px; height: 32px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 768px) {
    .header { padding: 16px; }
    .controls { padding: 16px 16px 0; }
    .main { padding: 16px; }
    .kpi-value { font-size: 22px; }
    th, td { padding: 10px 12px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo">GPV</div>
    <div>
      <div class="header-title">Matheus C.A-01</div>
      <div class="header-sub">Meta Ads · Import Cell BR</div>
    </div>
  </div>
  <a href="../index.html" class="back-btn">← Voltar</a>
</div>

<div class="controls">
  <button class="period-btn active" onclick="setPeriod(7)">7 dias</button>
  <button class="period-btn" onclick="setPeriod(14)">14 dias</button>
  <button class="period-btn" onclick="setPeriod(30)">30 dias</button>
  <button class="period-btn" onclick="setPeriod('month')">Este mês</button>
  <button class="period-btn" onclick="setPeriod('last_month')">Mês anterior</button>
  <button class="upload-btn" onclick="document.getElementById('csv-input').click()">⬆ Importar CSV</button>
  <input type="file" id="csv-input" accept=".csv" onchange="handleCSV(this)">
</div>

<div id="status" class="status-bar"></div>

<div class="main">
  <div id="kpi-grid" class="kpi-grid">
    <div class="loading"><div class="spinner"></div>Carregando dados...</div>
  </div>
  <div id="table-section"></div>
</div>

<script>
const SUPABASE_URL = 'https://shoaxshrkcagkpheplhp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_4R07t7BxqGANtdLF3GxuQQ_wu0UeUTG';
const CLIENT_ID = 'matheus';

let currentPeriod = 7;
let allData = [];

function setStatus(msg, type = 'info') {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status-bar ' + type;
}

function clearStatus() {
  document.getElementById('status').className = 'status-bar';
}

function setPeriod(p) {
  currentPeriod = p;
  document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderFromData(allData);
}

function getDateRange(period) {
  const now = new Date();
  let since, until;
  until = now.toISOString().split('T')[0];

  if (period === 'month') {
    since = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
  } else if (period === 'last_month') {
    const lm = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    since = lm.toISOString().split('T')[0];
    until = new Date(now.getFullYear(), now.getMonth(), 0).toISOString().split('T')[0];
  } else {
    const d = new Date(now);
    d.setDate(d.getDate() - period);
    since = d.toISOString().split('T')[0];
  }
  return { since, until };
}

function fmt(n, type = 'num') {
  if (!n || isNaN(n)) return '—';
  n = parseFloat(n);
  if (type === 'brl') return 'R$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  if (type === 'pct') return n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '%';
  if (type === 'k') return n >= 1000 ? (n/1000).toFixed(1) + 'k' : n.toLocaleString('pt-BR');
  return n.toLocaleString('pt-BR');
}

async function loadFromSupabase() {
  const { since, until } = getDateRange(currentPeriod);
  setStatus('Buscando dados do banco...', 'info');

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/reports?client_id=eq.${CLIENT_ID}&since=gte.${since}&order=since.desc&limit=1`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
    });
    const rows = await res.json();

    if (rows && rows.length > 0 && rows[0].data) {
      allData = rows[0].data;
      clearStatus();
      renderFromData(allData);
    } else {
      clearStatus();
      showEmpty();
    }
  } catch (e) {
    clearStatus();
    showEmpty();
  }
}

function handleCSV(input) {
  const file = input.files[0];
  if (!file) return;
  setStatus('Processando CSV...', 'info');

  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const rows = parseCSV(e.target.result);
      allData = rows;
      renderFromData(rows);
      await saveToSupabase(rows);
      setStatus('✓ CSV importado e salvo com sucesso!', 'success');
      setTimeout(clearStatus, 4000);
    } catch (err) {
      setStatus('Erro ao processar CSV: ' + err.message, 'error');
    }
  };
  reader.readAsText(file, 'UTF-8');
  input.value = '';
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  if (lines.length < 2) throw new Error('CSV vazio ou inválido');

  const headers = parseCSVLine(lines[0]);
  const rows = [];

  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const vals = parseCSVLine(lines[i]);
    const obj = {};
    headers.forEach((h, idx) => { obj[h.trim()] = (vals[idx] || '').trim(); });
    rows.push(obj);
  }
  return rows;
}

function parseCSVLine(line) {
  const result = [];
  let current = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { inQuotes = !inQuotes; }
    else if (c === ',' && !inQuotes) { result.push(current); current = ''; }
    else { current += c; }
  }
  result.push(current);
  return result;
}

async function saveToSupabase(rows) {
  const { since, until } = getDateRange(currentPeriod);
  const payload = { client_id: CLIENT_ID, since, until, data: rows };

  await fetch(`${SUPABASE_URL}/rest/v1/reports`, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'resolution=merge-duplicates'
    },
    body: JSON.stringify(payload)
  });
}

function filterByPeriod(rows) {
  if (!rows || !rows.length) return rows;
  const { since } = getDateRange(currentPeriod);
  return rows.filter(r => {
    const d = r['Início dos relatórios'] || r['inicio'] || '';
    return !d || d >= since;
  });
}

function renderFromData(rows) {
  const filtered = filterByPeriod(rows);
  const active = filtered.filter(r => (r['Veiculação da campanha'] || '').toLowerCase() === 'active');

  // KPIs
  let spend = 0, impr = 0, clicks = 0, reach = 0, conv = 0;
  filtered.forEach(r => {
    spend += parseFloat(r['Valor usado (BRL)'] || 0);
    impr  += parseFloat(r['Impressões'] || 0);
    clicks += parseFloat(r['Cliques no link'] || 0);
    reach += parseFloat(r['Alcance'] || 0);
    conv  += parseFloat(r['Resultados'] || 0);
  });

  const ctr = impr > 0 ? (clicks / impr * 100) : 0;
  const cpc = clicks > 0 ? (spend / clicks) : 0;
  const cpm = impr > 0 ? (spend / impr * 1000) : 0;

  document.getElementById('kpi-grid').innerHTML = `
    <div class="kpi-card purple">
      <div class="kpi-label">Investimento</div>
      <div class="kpi-value">${fmt(spend, 'brl')}</div>
      <div class="kpi-sub">${active.length} campanhas ativas</div>
    </div>
    <div class="kpi-card pink">
      <div class="kpi-label">Impressões</div>
      <div class="kpi-value">${fmt(impr, 'k')}</div>
      <div class="kpi-sub">CPM ${fmt(cpm, 'brl')}</div>
    </div>
    <div class="kpi-card green">
      <div class="kpi-label">Cliques no link</div>
      <div class="kpi-value">${fmt(clicks, 'k')}</div>
      <div class="kpi-sub">CPC ${fmt(cpc, 'brl')} · CTR ${fmt(ctr, 'pct')}</div>
    </div>
    <div class="kpi-card yellow">
      <div class="kpi-label">Alcance</div>
      <div class="kpi-value">${fmt(reach, 'k')}</div>
      <div class="kpi-sub">Resultados: ${fmt(conv)}</div>
    </div>
  `;

  // TABLE — só campanhas com gasto > 0
  const withData = filtered.filter(r => parseFloat(r['Valor usado (BRL)'] || 0) > 0);

  if (!withData.length) {
    document.getElementById('table-section').innerHTML = `
      <div class="empty">
        <div class="icon">📊</div>
        <h3>Nenhuma campanha com gasto no período</h3>
        <p>Importe um CSV do Meta Ads Manager para ver os dados, ou selecione um período diferente.</p>
      </div>`;
    return;
  }

  const rows_sorted = [...withData].sort((a,b) => parseFloat(b['Valor usado (BRL)']||0) - parseFloat(a['Valor usado (BRL)']||0));

  document.getElementById('table-section').innerHTML = `
    <div class="section-title">
      Campanhas <span class="badge">${rows_sorted.length}</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Campanha</th>
            <th>Status</th>
            <th style="text-align:right">Gasto</th>
            <th style="text-align:right">Impressões</th>
            <th style="text-align:right">Cliques</th>
            <th style="text-align:right">CTR</th>
            <th style="text-align:right">CPC</th>
            <th style="text-align:right">Resultados</th>
          </tr>
        </thead>
        <tbody>
          ${rows_sorted.map(r => {
            const isActive = (r['Veiculação da campanha']||'').toLowerCase() === 'active';
            const cpc_r = parseFloat(r['CPC (custo por clique no link) (BRL)']||0);
            const ctr_r = parseFloat(r['CTR (taxa de cliques no link)']||0);
            return `<tr>
              <td class="camp-name">
                ${r['Nome da campanha']||'—'}
              </td>
              <td><span class="badge-status ${isActive?'active':'inactive'}">${isActive?'Ativa':'Inativa'}</span></td>
              <td class="num">${fmt(parseFloat(r['Valor usado (BRL)']||0),'brl')}</td>
              <td class="num">${fmt(parseFloat(r['Impressões']||0),'k')}</td>
              <td class="num">${fmt(parseFloat(r['Cliques no link']||0),'k')}</td>
              <td class="num">${ctr_r ? fmt(ctr_r,'pct') : '—'}</td>
              <td class="num">${cpc_r ? fmt(cpc_r,'brl') : '—'}</td>
              <td class="num">${r['Resultados']||'—'}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;
}

function showEmpty() {
  document.getElementById('kpi-grid').innerHTML = `
    <div class="kpi-card purple"><div class="kpi-label">Investimento</div><div class="kpi-value">—</div></div>
    <div class="kpi-card pink"><div class="kpi-label">Impressões</div><div class="kpi-value">—</div></div>
    <div class="kpi-card green"><div class="kpi-label">Cliques</div><div class="kpi-value">—</div></div>
    <div class="kpi-card yellow"><div class="kpi-label">Alcance</div><div class="kpi-value">—</div></div>`;
  document.getElementById('table-section').innerHTML = `
    <div class="empty">
      <div class="icon">📂</div>
      <h3>Nenhum dado encontrado</h3>
      <p>Clique em <strong>⬆ Importar CSV</strong> para carregar os dados do Meta Ads Manager. O arquivo fica salvo e não precisa importar novamente.</p>
    </div>`;
}

loadFromSupabase();
</script>
</body>
</html>
