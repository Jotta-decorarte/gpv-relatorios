<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Import Cell BR — Acesso</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --navy:#080F1E;--surface:#0D1929;--surface2:#111E30;
    --accent:#2D6FE8;--accent2:#4A8FF5;
    --white:#EEF2FF;--muted:#7A8FB0;--border:rgba(255,255,255,0.06);
    --red:#EF4444;--red-bg:rgba(239,68,68,0.08);
    --green:#22C55E;
  }
  body{font-family:'Inter',sans-serif;background:var(--navy);color:var(--white);min-height:100vh;display:flex;align-items:center;justify-content:center}
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(45,111,232,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(45,111,232,0.025) 1px,transparent 1px);background-size:40px 40px;pointer-events:none}

  .box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px;width:100%;max-width:380px;position:relative;z-index:1}
  .logo{width:44px;height:44px;border-radius:12px;border:1px solid rgba(201,168,76,0.3);object-fit:cover;display:block;margin:0 auto 20px}
  .title{font-size:20px;font-weight:700;text-align:center;margin-bottom:4px;letter-spacing:-.02em}
  .sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:28px}

  .field{margin-bottom:12px}
  .field label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
  .field input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;color:var(--white);font-size:14px;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s}
  .field input:focus{border-color:var(--accent2)}

  .btn{width:100%;padding:12px;background:var(--accent);border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:opacity .2s;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn:hover{opacity:.9}
  .btn:disabled{opacity:.6;cursor:not-allowed}

  .err{font-size:12px;color:var(--red);text-align:center;margin-top:12px;min-height:18px;padding:8px 12px;border-radius:6px;display:none}
  .err.show{display:block;background:var(--red-bg);border:1px solid rgba(239,68,68,0.2)}

  .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .footer{text-align:center;font-size:11px;color:var(--muted);margin-top:24px}
</style>
</head>
<body>
<div class="box">
  <img class="logo" src="../assets/logo-gpv.webp" alt="GPV">
  <div class="title">Import Cell BR</div>
  <div class="sub">Digite suas credenciais de acesso</div>

  <div class="field">
    <label>Usuário</label>
    <input type="text" id="username" placeholder="Seu usuário" autocomplete="username" onkeydown="if(event.key==='Enter')doLogin()">
  </div>
  <div class="field">
    <label>Senha</label>
    <input type="password" id="password" placeholder="Sua senha" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
  </div>

  <button class="btn" id="loginBtn" onclick="doLogin()">Entrar</button>
  <div class="err" id="errMsg">Usuário ou senha incorretos.</div>

  <div class="footer">Agência GPV · Acesso restrito</div>
</div>

<script src="../assets/auth.js"></script>
<script>
  // Se já logado, redireciona
  const session = GPV_AUTH.getSession();
  if (session && session.client === 'importcell') window.location.replace('portal.html');
  if (session && session.role === 'admin') window.location.replace('portal.html');

  async function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('errMsg');

    if (!username || !password) {
      err.textContent = 'Preencha usuário e senha.';
      err.classList.add('show');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div> Entrando...';
    err.classList.remove('show');

    try {
      const result = await GPV_AUTH.loginClient(username, password);
      if (result.ok && result.client === 'importcell') {
        window.location.replace('portal.html');
      } else if (result.ok) {
        err.textContent = 'Este usuário não tem acesso a esta área.';
        err.classList.add('show');
        btn.disabled = false;
        btn.innerHTML = 'Entrar';
      } else {
        err.textContent = 'Usuário ou senha incorretos.';
        err.classList.add('show');
        btn.disabled = false;
        btn.innerHTML = 'Entrar';
      }
    } catch(e) {
      err.textContent = 'Erro de conexão. Tente novamente.';
      err.classList.add('show');
      btn.disabled = false;
      btn.innerHTML = 'Entrar';
    }
  }
</script>
</body>
</html>
